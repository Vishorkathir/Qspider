<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link{
            color:brown;
        }
        a:active{
            color:green
        }

        a:visited{
            color:mediumspringgreen
        }

 /* Focus*/

 input:focus{
    color:aqua;
    background-color: black;
    width: 100px;
    height: 30px;
 }


 /* Checked*/


 /*Need separated edition*/

 [type="radio"]:checked{

    accent-color: red;
 }

 [type="checkbox"]:checked{
    accent-color: rgb(255, 255, 0);
 }

  /*Hover*/

  p:hover{
    color: pink;
    background-color: black;
    text-decoration: underline;
    text-decoration: dotted;
  }


    </style>
</head>
<body>
    


    <!-- Link -->

    <a href="https://amazon.com">Amazon</a>


    <hr>
    <!-- focus -->

    <input type="text">

    <hr>
    <!-- checked -->

    <input type="radio">
    <input type="checkbox">

    <hr>

    <!-- hover -->

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aspernatur nulla eveniet nesciunt. Molestiae ad iure nisi doloribus omnis eligendi molestias accusamus exercitationem, excepturi quidem nobis, magni praesentium magnam culpa labore!</p>




</body>
</html>
