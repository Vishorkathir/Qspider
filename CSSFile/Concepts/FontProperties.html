<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FontProperties</title>
    <link rel="stylesheet" href="./FontProperties.css">

    <style>
        #demo{
            font-size: large;
            font-size: small;
            font-size: larger;
            font-size: smaller;
        }

        #demo1{
            font-weight: 500;
            font-weight: bolder;
        }

        #demo2{
            font-style: italic;
            font-style: oblique;
        }

        #demo3{

            font-variant: normal;
            font-variant: small-caps;
        }
/* 
        #demo4{
            font-family:  sans-serif;
             font-family: "Isometra", serif;
        } */

    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

    <!-- FONT SIZE -->
    
    <h1 id="demo">
        Hello World
    </h1>
    <hr>

    <!-- FONT WEIGHT -->

    <h1 id="demo1">Hello Buddy</h1>

    <hr>
    <!-- FONT STYLE -->

    <h1 id="demo2">Hello Welcome</h1>

    <hr>
    <!-- FONT VARIENT -->
     <h1 id="demo3">Hello Hi World</h1>
     <hr>
     <!-- FONT FAMILY -->

     <p id="demo4">Lorem ipsum dolor sit amet consectetur adipisicing elit. Rerum sequi ducimus nobis, omnis mollitia, aliquid maxime qui quos, iure ex expedita non distinctio magni odit architecto ea sit odio itaque!</p>

</body>
</html>
