<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /* padding */

        #demo{
          
            height: 100px;
            width: 100px;

            background-color: blue;
            padding: 30px;
            padding-top:30px;
            padding-right:40px;
            padding-bottom: 60px;
            padding-left: 60px;
        }

        /* border */
        #demo1{

            height: 100px;
            width: 100px;
            background-color: blueviolet;
            padding:30px;

            border: 2px solid black;
            border-top: 6px dashed rgb(0, 243, 243);
            border-right: 6px dotted rgb(0, 255, 13);
            border-bottom: 6px double rgb(251, 255, 0);
            margin-top: 30px;    

        }

        /* margin */

        #demo2{
            height: 100px;
            width: 100px;
            background-color: brown;
            /* margin:40px; */
            margin-top: 30px;
            margin-right: 50px;
            margin-bottom: 50px;
            margin-left: 50px;

        }


    </style>
</head>
<body>
    
    <!-- padding -->
    <div id="demo">
        HELLO WORLD
    </div>
    <hr>

    <!-- border -->
    <div id="demo1">
        HELLO WORLD
    </div>

    <hr>

    <!-- marign -->
    <div id="demo2">
        HELLO WORLD
    </div>
</body>
</html>
