<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        #demo1{
            height:200px;
            width: 200px;
            border: 2px solid black;
            background-image: linear-gradient(red,blue, green,orange);

        }
        #demo2{
              height:200px;
            width: 200px;
            border: 2px solid black;
            background-image: repeating-linear-gradient(to bottom right,red,blue 20% ,green,orange);
            background-image: repeating-linear-gradient(to top right,red 10%,blue 20% ,green 20%,orange 30%);

        }
        #demo3{
              height:200px;
            width: 200px;
            border: 2px solid black;
            background-image: radial-gradient(red,blue ,green,orange);

        }
        #demo4{
              height:200px;
            width: 200px;
            border: 2px solid black;
            background-image: repeating-radial-gradient(red,blue 20% ,green 30%,orange 20%);

        }
        #demo5{
              height:200px;
            width: 200px;
            border: 2px solid black;
            background-image: conic-gradient(red 90deg,blue 140deg ,green 220deg,orange 350deg);

        }
        #demo6{
              height:200px;
            width: 200px;
            border: 2px solid black;
            background-image: repeating-conic-gradient(black 90deg ,orange 120deg ,black 90deg,orange 30deg);

        }


    </style>



</head>
<body>
    

    <!-- Linear Gradient -->
    <div id="demo1"></div>

    <hr>


    <!-- Repeating Linear Gradient -->
    <div id="demo2"></div>
    <hr>

    <!--  Radial Gradient -->
    <div id="demo3"></div>

    <hr>

    <!-- Repeating Radial Gradient -->
    <div id="demo4"></div>

    <hr>

    <!-- Conic Gradient -->
    <div id="demo5"></div>

    <hr>
    <!-- Repeating Conic Gradient -->
    <div id="demo6"></div>


</body>
</html>
